[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-memory"
version = "0.2.1"
description = "Hierarchical Markdown/YAML graph memory for long-horizon AI agents — git-native, zero-token CI guardrails, no vector DB."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["memory", "llm", "ai-agent", "markdown", "knowledge-graph", "mcp", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # zero required deps — the core runs on stdlib only

[project.urls]
Homepage = "https://github.com/Scrimal/SPINE-Memory"
Repository = "https://github.com/Scrimal/SPINE-Memory"
Documentation = "https://github.com/Scrimal/SPINE-Memory/blob/main/methodology/SPINE_METHODOLOGY_EN.md"
Issues = "https://github.com/Scrimal/SPINE-Memory/issues"
Changelog = "https://github.com/Scrimal/SPINE-Memory/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["fastmcp>=2.0.0"]
tokens = ["tiktoken>=0.7.0"]
dev = ["fastmcp>=2.0.0", "tiktoken>=0.7.0"]

[project.scripts]
spine = "spine_memory.cli:main"

[tool.setuptools]
package-dir = { "spine_memory" = "tools" }
packages = ["spine_memory"]

[tool.setuptools.package-data]
spine_memory = ["*.py"]
